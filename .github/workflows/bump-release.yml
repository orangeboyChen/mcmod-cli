# File: .github/workflows/bump-release.yml
# Created: 2026-09-04
# Description: Creates a labeled pull request to increment the stable mcm version.

name: Bump Stable Release Version

on:
  workflow_dispatch:
    inputs:
      part:
        description: SemVer component to increment.
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch
      base_version:
        description: Optional x.y.z version to use as the increment base.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate next stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_VERSION" ]; then
            [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "base_version must be x.y.z" >&2; exit 1; }
            next="$BASE_VERSION"
          else
            latest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            latest="${latest:-0.0.0}"
            IFS=. read -r major minor patch <<< "$latest"
            case "$PART" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
              *) echo "unsupported version component: $PART" >&2; exit 1 ;;
            esac
          fi
          echo "value=$next" >> "$GITHUB_OUTPUT"
      - name: Update version source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          sed -i.bak -E "s/(const Version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$VERSION\"/" internal/domain/common.go
          rm internal/domain/common.go.bak
          git diff --check
      - name: Create version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add internal/domain/common.go
          git commit -m "chore(release): bump version to $VERSION"
          git push --set-upstream origin "$branch"
          gh label create release --color 0E8A16 --description "Version and release automation" --force
          gh pr create --base main --head "$branch" --title "chore(release): bump version to $VERSION" --body "Automated stable release version bump to \`$VERSION\`." --label release
