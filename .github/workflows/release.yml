# File: .github/workflows/release.yml
# Created: 2026-09-04
# Description: Publishes tagged mcm stable and canary releases.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.ref_name, '-canary.') }}
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref_name, '-canary.') }}
