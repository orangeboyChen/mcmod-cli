# File: .github/workflows/release.yml
# Created: 2026-06-20
# Description: Release workflow for mcmod - build binaries, checksums, and publish.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install golint
        run: go install golang.org/x/lint/golint@latest
      - name: Run CI checks
        run: |
          go mod tidy
          gofmt -w $(find . -name '*.go' -not -path './.cache/*')
          golint ./...
          go vet ./...
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/mcmod_linux_amd64 ./cmd/mcmod
          GOOS=linux GOARCH=arm64 go build -o dist/mcmod_linux_arm64 ./cmd/mcmod
          GOOS=windows GOARCH=amd64 go build -o dist/mcmod_windows_amd64.exe ./cmd/mcmod
          GOOS=darwin GOARCH=arm64 go build -o dist/mcmod_darwin_arm64 ./cmd/mcmod
      - name: Create archives
        run: |
          cd dist
          version=${GITHUB_REF_NAME#v}
          tar czf mcmod_cli_${version}_linux_amd64.tar.gz mcmod_linux_amd64
          tar czf mcmod_cli_${version}_linux_arm64.tar.gz mcmod_linux_arm64
          zip -r mcmod_cli_${version}_windows_amd64.zip mcmod_windows_amd64.exe
          tar czf mcmod_cli_${version}_darwin_arm64.tar.gz mcmod_darwin_arm64
          sha256sum mcmod_cli_${version}_linux_amd64.tar.gz \
                    mcmod_cli_${version}_linux_arm64.tar.gz \
                    mcmod_cli_${version}_windows_amd64.zip \
                    mcmod_cli_${version}_darwin_arm64.tar.gz > mcmod_cli_${version}_checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mcmod_cli_*.tar.gz
            dist/mcmod_cli_*.zip
            dist/mcmod_cli_*_checksums.txt
          generate_release_notes: true
